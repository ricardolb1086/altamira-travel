<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pago no completado — Altamira Travel</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--cream:oklch(0.972 0.012 78);--ink:oklch(0.245 0.014 58);--ink-soft:oklch(0.42 0.02 60);--line:oklch(0.86 0.014 76);--terra:oklch(0.575 0.115 46);--terra-deep:oklch(0.48 0.11 42);--serif:"Cormorant Garamond",Georgia,serif;--sans:"Hanken Grotesk",system-ui,sans-serif;--mono:"IBM Plex Mono",monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.box{max-width:460px}
.overline{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:14px}
h1{font-family:var(--serif);font-size:clamp(32px,5.5vw,46px);font-weight:500;line-height:1.1;margin-bottom:18px}
h1 em{font-style:italic;color:var(--terra-deep)}
p{font-size:16px;color:var(--ink-soft);line-height:1.7;margin-bottom:24px}
.wa{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff;padding:14px 28px;border-radius:100px;text-decoration:none;font-weight:600;font-size:14px}
.brand{display:inline-flex;align-items:center;gap:9px;margin-top:36px;padding-top:28px;border-top:1px solid var(--line)}
.brand .mark{width:26px;height:26px;border-radius:50%;background:var(--terra);display:grid;place-items:center}
.brand .mark::after{content:"";width:9px;height:9px;border-radius:50%;border:2px solid var(--cream)}
.brand .name{font-family:var(--serif);font-size:18px;letter-spacing:.14em;font-weight:500;text-transform:uppercase}
.brand .name b{color:var(--terra-deep)}
</style>
</head>
<body>
<div class="box">
  <p class="overline">Pago no completado</p>
  <h1>No te <em>preocupes</em>.</h1>
  <p>Tu pago no se completó y no se realizó ningún cargo. Si tuviste algún inconveniente o tienes dudas, escríbenos y te ayudamos a finalizar tu reserva.</p>
  <a class="wa" href="https://wa.me/17869779648?text=Hola%2C%20tuve%20un%20problema%20al%20completar%20mi%20pago">💬 Escríbenos por WhatsApp</a>
  <div class="brand"><span class="mark"></span><span class="name">Alta<b>mira</b> Travel</span></div>
</div>
</body>
</html>
