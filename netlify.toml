[build]
  publish = "."
  functions = "netlify/functions"

# Desactiva el "Pretty URLs" de Netlify (que redirige .html -> sin extensión).
# Las reglas de _redirects hacen lo contrario (sin extensión -> .html, según el
# canonical de cada página); dejar ambos activos crearía un bucle de redirección.
[build.processing.html]
  pretty_urls = false

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/destinations.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
